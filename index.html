<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1e2d3d;
    --ink-muted: #4a6278;
    --ink-faint: #8aa0b4;
    --ink-ghost: #b8c6d4;
    --surface: #f8fafc;
    --card: #ffffff;
    --warm: #eef2f7;
    --border: #dde5ec;
    --border-mid: #c0cdd8;
    --accent: #185FA5;
    --accent-bg: #e8f1fb;
    --accent-text: #0c447c;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #f8fafc; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    color: #1e2d3d;
    background: #f8fafc;
    min-height: 100vh;
    padding: 0 1.25rem;
    font-size: 15px;
    line-height: 1.6;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 0 5rem; }

  /* Header */
  .hd { padding: 2.5rem 0 1.25rem; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .hd h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 400; }
  .hd .date { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; text-transform: uppercase; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 1.75rem; flex-wrap: wrap; }
  .tab { font-size: 13px; padding: 8px 14px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-faint); cursor: pointer; margin-bottom: -1px; font-family: inherit; }
  .tab:hover { color: var(--ink-muted); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.on { display: block; }

  /* Capture form */
  .capture { background: var(--card); border: 0.5px solid var(--border-mid); border-radius: 12px; padding: 1.25rem; margin-bottom: 2rem; }
  .capture textarea, .capture input { width: 100%; font-family: inherit; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 9px 11px; background: var(--card); color: var(--ink); outline: none; font-size: 14px; }
  .capture textarea:focus, .capture input:focus { border-color: var(--accent); }
  .capture textarea::placeholder, .capture input::placeholder { color: var(--ink-ghost); }
  .q-field { font-family: 'Lora', Georgia, serif !important; font-size: 15px !important; line-height: 1.7; resize: vertical; min-height: 52px; }
  .n-field { resize: vertical; min-height: 76px; line-height: 1.6; }
  .flabel { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin: 12px 0 5px; }
  .flabel:first-of-type { margin-top: 0; }
  .seg { display: flex; gap: 4px; margin-bottom: 11px; }
  .seg-b { font-family: inherit; font-size: 12px; padding: 5px 13px; border-radius: 20px; border: 0.5px solid var(--border); background: none; color: var(--ink-faint); cursor: pointer; }
  .seg-b:hover { color: var(--ink-muted); border-color: var(--border-mid); }
  .seg-b.on { background: var(--accent-bg); border-color: #b5d4f4; color: var(--accent-text); }
  .f-row { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .f-row > * { flex: 1; min-width: 130px; }
  .capture select { font-family: inherit; font-size: 13px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 9px 11px; background: var(--card); color: var(--ink); outline: none; cursor: pointer; }
  .cap-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }
  .hint { font-size: 11px; color: var(--ink-ghost); }
  .btn { font-family: inherit; font-size: 13px; padding: 8px 18px; border-radius: var(--radius); border: 0.5px solid var(--border-mid); background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--warm); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { opacity: 0.87; background: var(--ink); }
  .btn.sm { font-size: 11px; padding: 4px 11px; }
  .btn:disabled { opacity: 0.45; pointer-events: none; }

  /* Entry card */
  .entry { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 1rem 1.15rem; margin-bottom: 10px; }
  .entry:hover { border-color: var(--border-mid); }
  .e-link { display: flex; align-items: center; gap: 6px; padding-bottom: 9px; border-bottom: 0.5px solid var(--border); margin-bottom: 11px; }
  .e-link a { font-size: 12px; color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-link a:hover { text-decoration: underline; }
  .e-quote { font-family: 'Lora', Georgia, serif; font-size: 15px; line-height: 1.75; color: var(--ink); margin-bottom: 10px; white-space: pre-wrap; padding-left: 12px; border-left: 2px solid var(--border-mid); }
  .e-note { font-size: 14px; line-height: 1.65; color: var(--ink-muted); white-space: pre-wrap; margin-bottom: 11px; }
  .e-foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: var(--radius); background: var(--warm); color: var(--ink-muted); border: 0.5px solid var(--border); }
  .chip.type { background: var(--accent-bg); color: var(--accent-text); border-color: #b5d4f4; }
  .chip.tag { border-radius: 20px; background: #f0edfa; color: #3c3489; border-color: #cecbf6; cursor: pointer; }
  .chip.tag:hover { background: #e4dff5; }
  .chip.src { cursor: pointer; }
  .chip.src:hover { background: var(--border); }
  .e-date { font-size: 11px; color: var(--ink-ghost); margin-left: auto; }
  .e-del { font-size: 11px; color: var(--ink-ghost); background: none; border: none; cursor: pointer; padding: 2px 4px; font-family: inherit; }
  .e-del:hover { color: #993c1d; }

  /* Section label */
  .slabel { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 1rem; display: flex; align-items: center; gap: 9px; }
  .slabel::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .filters input, .filters select { font-family: inherit; font-size: 13px; border: 0.5px solid var(--border-mid); border-radius: var(--radius); padding: 8px 11px; background: var(--card); color: var(--ink); outline: none; }
  .filters input { flex: 2; min-width: 170px; }
  .filters select { flex: 1; min-width: 118px; cursor: pointer; }
  .filters input:focus { border-color: var(--accent); }
  .active-filter { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; font-size: 12px; color: var(--ink-muted); }

  .count { font-size: 12px; color: var(--ink-faint); margin-bottom: 1rem; }

  /* Digest */
  .dg-head { display: flex; gap: 8px; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .dg-head select { font-family: inherit; font-size: 13px; border: 0.5px solid var(--border-mid); border-radius: var(--radius); padding: 8px 11px; background: var(--card); color: var(--ink); cursor: pointer; outline: none; }
  .dg-group { margin-bottom: 2rem; }
  .dg-gtitle { font-family: 'Playfair Display', Georgia, serif; font-size: 17px; font-weight: 400; margin-bottom: 0.85rem; padding-bottom: 5px; border-bottom: 0.5px solid var(--border-mid); }
  .dg-item { padding: 0.85rem 0; border-bottom: 0.5px solid var(--border); }
  .dg-item:last-child { border-bottom: none; }
  .dg-src { font-size: 11px; color: var(--ink-faint); margin-bottom: 5px; }
  .dg-src a { color: var(--accent); text-decoration: none; }
  .dg-src a:hover { text-decoration: underline; }
  .dg-quote { font-family: 'Lora', Georgia, serif; font-size: 15px; line-height: 1.75; padding-left: 12px; border-left: 2px solid var(--border-mid); margin-bottom: 8px; white-space: pre-wrap; }
  .dg-note { font-size: 14px; line-height: 1.65; color: var(--ink-muted); white-space: pre-wrap; }
  .patterns { margin-top: 2rem; padding-top: 1.5rem; border-top: 0.5px solid var(--border-mid); }
  .p-out { font-family: 'Lora', Georgia, serif; font-size: 14px; line-height: 1.85; white-space: pre-wrap; margin-top: 1rem; }

  /* Shelf */
  .shelf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 1rem; }
  .book { background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; }
  .b-title { font-family: 'Playfair Display', Georgia, serif; font-size: 14px; font-style: italic; line-height: 1.35; }
  .b-author { font-size: 11px; color: var(--ink-faint); margin-bottom: 9px; }
  .book textarea { width: 100%; font-family: 'Lora', Georgia, serif; font-size: 13px; line-height: 1.6; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 7px 9px; background: var(--card); color: var(--ink); resize: vertical; min-height: 58px; outline: none; }
  .book textarea:focus { border-color: var(--accent); }
  .b-acts { display: flex; gap: 6px; margin-top: 9px; }
  .b-acts button { font-family: inherit; font-size: 10px; padding: 3px 10px; border-radius: 20px; border: 0.5px solid var(--border); background: none; color: var(--ink-faint); cursor: pointer; }
  .b-acts button:hover { color: var(--ink-muted); border-color: var(--border-mid); background: var(--warm); }
  .add-book { font-family: inherit; font-size: 12px; padding: 9px; border-radius: var(--radius); border: 0.5px dashed var(--border-mid); background: none; color: var(--ink-faint); cursor: pointer; width: 100%; }
  .add-book:hover { color: var(--accent); border-color: var(--accent); background: var(--warm); }
  .past-book { padding: 0.6rem 0; border-bottom: 0.5px solid var(--border); display: flex; gap: 11px; align-items: baseline; font-size: 13px; }
  .past-book .pb-date { font-size: 11px; color: var(--ink-faint); min-width: 78px; }

  /* API bar */
  .api { background: var(--warm); border: 0.5px solid var(--border); border-radius: 12px; padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .api input { flex: 1; min-width: 190px; font-family: monospace; font-size: 12px; border: 0.5px solid var(--border-mid); border-radius: var(--radius); padding: 7px 10px; background: var(--card); color: var(--ink); outline: none; }
  .api .lbl { font-size: 12px; color: var(--ink-muted); }

  .empty { font-size: 13px; color: var(--ink-faint); font-style: italic; padding: 2rem 0; text-align: center; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 20px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }

  .util { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 1rem; flex-wrap: wrap; }

  .spin { width: 13px; height: 13px; border: 1.5px solid var(--border-mid); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.7s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 620px) {
    .f-row > * { min-width: 100%; }
    .shelf-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hd">
    <h1>Field Notes</h1>
    <div class="date" id="today"></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-panel="p-week">This week</button>
    <button class="tab" data-panel="p-arch">Archive</button>
    <button class="tab" data-panel="p-dig">Digest</button>
    <button class="tab" data-panel="p-shelf">Shelf</button>
    <button class="tab" data-panel="p-set">Settings</button>
  </div>

  <!-- THIS WEEK -->
  <div class="panel on" id="p-week">
    <div class="capture">
      <div class="seg" id="seg">
        <button class="seg-b on" data-t="Reading">Reading</button>
        <button class="seg-b" data-t="Clinical">Clinical</button>
        <button class="seg-b" data-t="Thought">Thought</button>
      </div>
      <div class="flabel">Quote</div>
      <textarea class="q-field" id="q"></textarea>
      <div class="flabel">Note</div>
      <textarea class="n-field" id="n"></textarea>
      <div class="flabel">Link</div>
      <input type="url" id="lnk">
      <div class="f-row">
        <input type="text" id="src" placeholder="Source" list="src-list">
        <input type="text" id="tg" placeholder="Tags, comma separated" list="tag-list">
      </div>
      <datalist id="src-list"></datalist>
      <datalist id="tag-list"></datalist>
      <div class="cap-foot">
        <span class="hint" id="cap-hint">Source fills in from the link</span>
        <button class="btn primary" id="save-btn">Save entry</button>
      </div>
    </div>

    <div class="slabel">This week</div>
    <div id="week-list"></div>
  </div>

  <!-- ARCHIVE -->
  <div class="panel" id="p-arch">
    <div class="filters">
      <input type="search" id="q-search" placeholder="Search quotes, notes, sources, tags">
      <select id="f-type"><option value="">All types</option></select>
      <select id="f-src"><option value="">All sources</option></select>
      <select id="f-tag"><option value="">All tags</option></select>
    </div>
    <div class="filters" style="margin-top:-0.5rem">
      <select id="f-range">
        <option value="">Any time</option>
        <option value="7">Past 7 days</option>
        <option value="30">Past 30 days</option>
        <option value="90">Past 3 months</option>
        <option value="365">Past year</option>
        <option value="custom">Custom range</option>
      </select>
      <input type="date" id="f-from" style="display:none" title="From">
      <input type="date" id="f-to" style="display:none" title="To">
      <button class="btn" id="f-clear" style="flex:0">Clear all</button>
    </div>
    <div class="count" id="arch-count"></div>
    <div id="arch-list"></div>
  </div>

  <!-- DIGEST -->
  <div class="panel" id="p-dig">
    <div class="dg-head">
      <select id="wk-pick"></select>
      <select id="dg-group-by">
        <option value="tag">Group by tag</option>
        <option value="source">Group by source</option>
        <option value="type">Group by type</option>
        <option value="date">By date</option>
      </select>
      <button class="btn sm" id="copy-dg">Copy</button>
    </div>
    <div id="dg-body"></div>
    <div class="patterns" id="p-wrap" style="display:none">
      <button class="btn" id="pat-btn">Find patterns in this week</button>
      <div class="p-out" id="pat-out"></div>
    </div>
  </div>

  <!-- SHELF -->
  <div class="panel" id="p-shelf">
    <div class="slabel">Currently reading</div>
    <div class="shelf-grid" id="shelf"></div>
    <button class="add-book" id="add-book">+ Add book</button>
    <div id="shelf-past"></div>
  </div>

  <!-- SETTINGS -->
  <div class="panel" id="p-set">
    <div class="slabel">API key</div>
    <div class="api">
      <span class="lbl">Anthropic key</span>
      <input type="password" id="key" placeholder="Only needed for Find patterns">
      <button class="btn" id="save-key">Save</button>
    </div>
    <p style="font-size:13px;color:var(--ink-muted);margin-bottom:2rem;line-height:1.7">
      Only the Find patterns button uses the API. Capture, archive, search and the digest all run locally and cost nothing.
    </p>

    <div class="slabel">Your data</div>
    <div class="util" style="justify-content:flex-start">
      <button class="btn" id="exp">Export everything</button>
      <button class="btn" id="imp-btn">Import a backup</button>
      <input type="file" id="imp" accept=".json" style="display:none">
    </div>
    <p style="font-size:13px;color:var(--ink-muted);line-height:1.7" id="stats"></p>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
var KEY = 'fn_v1';
var OLD_KEY = 'te_v9';

function blank() {
  return { apiKey: '', entries: [], shelf: [], shelfArchive: [], migrated: false };
}
function load() {
  try { var s = JSON.parse(localStorage.getItem(KEY)); return s || blank(); }
  catch (e) { return blank(); }
}
function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 1900);
}

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtLong(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* Derive a readable source name from a URL */
function srcFromUrl(url) {
  try {
    var h = new URL(url).hostname.replace(/^www\./, '');
    var parts = h.split('.');
    if (h.indexOf('.substack.com') !== -1) {
      return parts[0].split('-').map(cap).join(' ');
    }
    var known = {
      'nytimes.com': 'New York Times', 'washingtonpost.com': 'Washington Post',
      'theatlantic.com': 'The Atlantic', 'newyorker.com': 'The New Yorker',
      'theguardian.com': 'The Guardian', 'aeon.co': 'Aeon', 'psyche.co': 'Psyche',
      'lithub.com': 'Literary Hub', 'statnews.com': 'STAT', 'wsj.com': 'Wall Street Journal',
      'technologyreview.com': 'MIT Technology Review', 'publicbooks.org': 'Public Books',
      'wired.com': 'Wired', 'nature.com': 'Nature', 'science.org': 'Science',
      'thehastingscenter.org': 'Hastings Center', 'pubmed.ncbi.nlm.nih.gov': 'PubMed'
    };
    var base = parts.slice(-2).join('.');
    if (known[h]) return known[h];
    if (known[base]) return known[base];
    return cap(parts[0] === 'blog' || parts[0] === 'www' ? parts[1] || parts[0] : parts[0]);
  } catch (e) { return ''; }
}
function cap(w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : ''; }

/* ---------- Migration from the old version ---------- */
function migrate() {
  var s = load();
  if (s.migrated) return;
  var old = null;
  try { old = JSON.parse(localStorage.getItem(OLD_KEY)); } catch (e) { old = null; }
  s.migrated = true;
  if (!old) { save(s); return; }
  var n = 0;
  (old.fragments || []).forEach(function (f) {
    if (!f.text || !f.text.trim()) return;
    s.entries.push({
      id: 'm' + f.id, date: f.date || new Date().toISOString(),
      quote: '', note: f.text, link: '', type: 'Thought',
      source: f.attribution || '', tags: []
    });
    n++;
  });
  var notes = old.notes || {};
  Object.keys(notes).forEach(function (k) {
    if (!notes[k] || !notes[k].trim()) return;
    var link = '';
    if (k.indexOf('url_') === 0) {
      var guess = k.slice(4).replace(/_/g, '/');
      if (guess.indexOf('https') === 0) link = guess.replace('https/', 'https://').replace(/\/\/+/g, '/').replace('https:/', 'https://');
    }
    s.entries.push({
      id: 'mn' + k, date: (old.noteDates && old.noteDates[k]) || new Date().toISOString(),
      quote: '', note: notes[k], link: link, type: 'Reading',
      source: link ? srcFromUrl(link) : '', tags: []
    });
    n++;
  });
  if (old.shelf && old.shelf.length && !s.shelf.length) s.shelf = old.shelf;
  if (old.shelfArchive && old.shelfArchive.length && !s.shelfArchive.length) s.shelfArchive = old.shelfArchive;
  if (old.apiKey && !s.apiKey) s.apiKey = old.apiKey;
  save(s);
  if (n) setTimeout(function () { toast('Brought over ' + n + ' entries from the old version'); }, 700);
}

/* ---------- Capture ---------- */
var curType = 'Reading';
var HINTS = {
  Reading: 'Source fills in from the link',
  Clinical: 'No link needed. Source can name a setting or stay blank',
  Thought: 'Quote and link are optional here'
};
function setType(t) {
  curType = t;
  document.getElementById('cap-hint').textContent = HINTS[t];
  var bs = document.querySelectorAll('.seg-b');
  for (var i = 0; i < bs.length; i++) {
    bs[i].classList.toggle('on', bs[i].getAttribute('data-t') === t);
  }
}

function saveEntry() {
  var q = document.getElementById('q').value.trim();
  var note = document.getElementById('n').value.trim();
  if (!q && !note) { toast('Add a quote or a note first'); return; }
  var link = document.getElementById('lnk').value.trim();
  var src = document.getElementById('src').value.trim();
  var tags = document.getElementById('tg').value.split(',')
    .map(function (t) { return t.trim(); }).filter(Boolean);
  var s = load();
  s.entries.unshift({
    id: 'e' + Date.now(), date: new Date().toISOString(),
    quote: q, note: note, link: link, type: curType,
    source: src || (link ? srcFromUrl(link) : ''), tags: tags
  });
  save(s);
  document.getElementById('q').value = '';
  document.getElementById('n').value = '';
  document.getElementById('lnk').value = '';
  document.getElementById('src').value = '';
  document.getElementById('tg').value = '';
  setType(curType);
  toast('Saved');
  renderAll();
  document.getElementById(curType === 'Reading' ? 'q' : 'n').focus();
}

/* ---------- Entry rendering ---------- */
function entryEl(e, opts) {
  opts = opts || {};
  var d = document.createElement('div');
  d.className = 'entry';

  if (e.link) {
    var lw = document.createElement('div');
    lw.className = 'e-link';
    var a = document.createElement('a');
    a.href = e.link; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = e.link.replace(/^https?:\/\/(www\.)?/, '');
    lw.appendChild(a);
    d.appendChild(lw);
  }
  if (e.quote) {
    var qd = document.createElement('div');
    qd.className = 'e-quote'; qd.textContent = e.quote;
    d.appendChild(qd);
  }
  if (e.note) {
    var nd = document.createElement('div');
    nd.className = 'e-note'; nd.textContent = e.note;
    d.appendChild(nd);
  }

  var f = document.createElement('div');
  f.className = 'e-foot';
  var t = document.createElement('span');
  t.className = 'chip type'; t.textContent = e.type || 'Reading';
  f.appendChild(t);

  if (e.source) {
    var sc = document.createElement('span');
    sc.className = 'chip src'; sc.textContent = e.source;
    sc.title = 'Filter by this source';
    sc.onclick = function () { jumpFilter('src', e.source); };
    f.appendChild(sc);
  }
  (e.tags || []).forEach(function (tag) {
    var tc = document.createElement('span');
    tc.className = 'chip tag'; tc.textContent = tag;
    tc.title = 'Filter by this tag';
    tc.onclick = function () { jumpFilter('tag', tag); };
    f.appendChild(tc);
  });

  var dt = document.createElement('span');
  dt.className = 'e-date';
  dt.textContent = opts.longDate ? fmtLong(e.date) : fmtDate(e.date);
  f.appendChild(dt);

  var del = document.createElement('button');
  del.className = 'e-del'; del.textContent = 'delete'; del.title = 'Delete entry';
  del.onclick = function () {
    if (!confirm('Delete this entry?')) return;
    var s = load();
    s.entries = s.entries.filter(function (x) { return x.id !== e.id; });
    save(s); renderAll(); toast('Deleted');
  };
  f.appendChild(del);

  d.appendChild(f);
  return d;
}

function weekAgo() { return Date.now() - 7 * 24 * 60 * 60 * 1000; }

function renderWeek() {
  var s = load();
  var box = document.getElementById('week-list');
  var cut = weekAgo();
  var list = s.entries.filter(function (e) { return new Date(e.date).getTime() > cut; });
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="empty">Nothing yet this week. Everything you save will appear here.</div>';
    return;
  }
  list.forEach(function (e) { box.appendChild(entryEl(e)); });
}

/* ---------- Archive ---------- */
function jumpFilter(kind, val) {
  showPanel('p-arch');
  document.getElementById('q-search').value = '';
  document.getElementById('f-type').value = '';
  document.getElementById('f-src').value = kind === 'src' ? val : '';
  document.getElementById('f-tag').value = kind === 'tag' ? val : '';
  document.getElementById('f-range').value = '';
  document.getElementById('f-from').style.display = 'none';
  document.getElementById('f-to').style.display = 'none';
  renderArchive();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function dateBounds() {
  var r = document.getElementById('f-range').value;
  if (!r) return null;
  if (r === 'custom') {
    var f = document.getElementById('f-from').value;
    var t = document.getElementById('f-to').value;
    if (!f && !t) return null;
    return {
      from: f ? new Date(f + 'T00:00:00').getTime() : 0,
      to: t ? new Date(t + 'T23:59:59').getTime() : Infinity
    };
  }
  return { from: Date.now() - parseInt(r, 10) * 24 * 60 * 60 * 1000, to: Infinity };
}

function renderArchive() {
  var s = load();
  var term = document.getElementById('q-search').value.trim().toLowerCase();
  var ft = document.getElementById('f-type').value;
  var fs = document.getElementById('f-src').value;
  var fg = document.getElementById('f-tag').value;
  var bounds = dateBounds();

  var list = s.entries.filter(function (e) {
    if (ft && e.type !== ft) return false;
    if (fs && e.source !== fs) return false;
    if (fg && (e.tags || []).indexOf(fg) === -1) return false;
    if (bounds) {
      var t = new Date(e.date).getTime();
      if (t < bounds.from || t > bounds.to) return false;
    }
    if (term) {
      var hay = [e.quote, e.note, e.source, e.link, (e.tags || []).join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(term) === -1) return false;
    }
    return true;
  });

  var c = document.getElementById('arch-count');
  var total = s.entries.length;
  c.textContent = list.length === total
    ? total + (total === 1 ? ' entry' : ' entries')
    : list.length + ' of ' + total + ' entries';

  var box = document.getElementById('arch-list');
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="empty">Nothing matches.</div>';
    return;
  }
  list.forEach(function (e) { box.appendChild(entryEl(e, { longDate: true })); });
}

function refreshFilters() {
  var s = load();
  var types = {}, srcs = {}, tags = {};
  s.entries.forEach(function (e) {
    if (e.type) types[e.type] = (types[e.type] || 0) + 1;
    if (e.source) srcs[e.source] = (srcs[e.source] || 0) + 1;
    (e.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; });
  });
  fillSelect('f-type', types, 'All types');
  fillSelect('f-src', srcs, 'All sources');
  fillSelect('f-tag', tags, 'All tags');
  fillList('src-list', Object.keys(srcs));
  fillList('tag-list', Object.keys(tags));
}
function fillSelect(id, counts, allLabel) {
  var sel = document.getElementById(id);
  var cur = sel.value;
  var keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
  sel.innerHTML = '<option value="">' + allLabel + '</option>';
  keys.forEach(function (k) {
    sel.innerHTML += '<option value="' + esc(k) + '">' + esc(k) + ' (' + counts[k] + ')</option>';
  });
  if (keys.indexOf(cur) !== -1) sel.value = cur;
}
function fillList(id, arr) {
  document.getElementById(id).innerHTML = arr.sort().map(function (v) {
    return '<option value="' + esc(v) + '">';
  }).join('');
}

/* ---------- Digest ---------- */
function weekStart(d) {
  var x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - x.getDay());
  return x;
}
function buildWeeks() {
  var s = load();
  var map = {};
  s.entries.forEach(function (e) {
    var ws = weekStart(e.date).toISOString().slice(0, 10);
    map[ws] = (map[ws] || 0) + 1;
  });
  var thisWk = weekStart(new Date()).toISOString().slice(0, 10);
  if (!map[thisWk]) map[thisWk] = 0;
  var keys = Object.keys(map).sort().reverse();
  var sel = document.getElementById('wk-pick');
  var cur = sel.value;
  sel.innerHTML = keys.map(function (k) {
    var st = new Date(k + 'T00:00:00');
    var en = new Date(st); en.setDate(en.getDate() + 6);
    var lbl = st.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' - ' +
      en.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    if (k === thisWk) lbl = 'This week (' + lbl + ')';
    return '<option value="' + k + '">' + lbl + '  ' + map[k] + '</option>';
  }).join('');
  sel.value = (keys.indexOf(cur) !== -1) ? cur : keys[0];
}

function digestEntries() {
  var s = load();
  var wk = document.getElementById('wk-pick').value;
  if (!wk) return [];
  var st = new Date(wk + 'T00:00:00').getTime();
  var en = st + 7 * 24 * 60 * 60 * 1000;
  return s.entries.filter(function (e) {
    var t = new Date(e.date).getTime();
    return t >= st && t < en;
  }).sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
}

function renderDigest() {
  var list = digestEntries();
  var by = document.getElementById('dg-group-by').value;
  var box = document.getElementById('dg-body');
  box.innerHTML = '';
  document.getElementById('p-wrap').style.display = list.length ? 'block' : 'none';
  document.getElementById('pat-out').textContent = '';

  if (!list.length) {
    box.innerHTML = '<div class="empty">Nothing saved that week.</div>';
    return;
  }

  var groups = {};
  var order = [];
  function push(k, e) {
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(e);
  }
  list.forEach(function (e) {
    if (by === 'tag') {
      if (!e.tags || !e.tags.length) push('Untagged', e);
      else e.tags.forEach(function (t) { push(t, e); });
    } else if (by === 'source') push(e.source || 'No source', e);
    else if (by === 'type') push(e.type || 'Reading', e);
    else push(new Date(e.date).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }), e);
  });

  if (by === 'tag') {
    order.sort(function (a, b) {
      if (a === 'Untagged') return 1;
      if (b === 'Untagged') return -1;
      return groups[b].length - groups[a].length;
    });
  }

  order.forEach(function (k) {
    var g = document.createElement('div');
    g.className = 'dg-group';
    var h = document.createElement('div');
    h.className = 'dg-gtitle';
    h.textContent = k + '  (' + groups[k].length + ')';
    g.appendChild(h);
    groups[k].forEach(function (e) {
      var it = document.createElement('div');
      it.className = 'dg-item';
      var meta = document.createElement('div');
      meta.className = 'dg-src';
      meta.appendChild(document.createTextNode(fmtDate(e.date) + (e.source ? '  ' + e.source : '') + '  '));
      if (e.link) {
        var a = document.createElement('a');
        a.href = e.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'link';
        meta.appendChild(a);
      }
      it.appendChild(meta);
      if (e.quote) {
        var q = document.createElement('div');
        q.className = 'dg-quote'; q.textContent = e.quote;
        it.appendChild(q);
      }
      if (e.note) {
        var n = document.createElement('div');
        n.className = 'dg-note'; n.textContent = e.note;
        it.appendChild(n);
      }
      g.appendChild(it);
    });
    box.appendChild(g);
  });
}

function digestText() {
  var list = digestEntries();
  return list.map(function (e) {
    var head = fmtDate(e.date) + (e.source ? ' | ' + e.source : '') +
      ((e.tags && e.tags.length) ? ' | tags: ' + e.tags.join(', ') : '');
    var body = '';
    if (e.quote) body += 'Quote: ' + e.quote + '\n';
    if (e.note) body += 'My note: ' + e.note + '\n';
    if (e.link) body += 'Link: ' + e.link + '\n';
    return head + '\n' + body;
  }).join('\n');
}

async function findPatterns() {
  var s = load();
  if (!s.apiKey) { toast('Add your API key in Settings first'); return; }
  var list = digestEntries();
  if (!list.length) return;
  var btn = document.getElementById('pat-btn');
  var out = document.getElementById('pat-out');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Reading your week';
  out.textContent = '';
  var prompt = 'Below is a week of reading notes from Ruth, a clinical neuropsychologist who writes about AI, selfhood, consciousness, embodied cognition, aging and memory.\n\n' +
    'Name 2 or 3 genuine resonances across these entries - places where ideas from different sources seem to be circling the same thing. Be specific and spare. Do not summarize her notes back to her, do not tell her what to write, and do not praise. Just name what seems to be in conversation.\n\n' + digestText();
  try {
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json', 'x-api-key': s.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 700,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    var data = await r.json();
    if (data.error) throw new Error(data.error.message || 'API error');
    var tb = (data.content || []).find(function (b) { return b.type === 'text'; });
    out.textContent = tb ? tb.text : 'No response.';
  } catch (err) {
    out.textContent = 'Could not load patterns: ' + err.message;
  }
  btn.disabled = false;
  btn.textContent = 'Find patterns in this week';
}

/* ---------- Shelf ---------- */
function logFromBook(title) {
  showPanel('p-week');
  setType('Reading');
  document.getElementById('src').value = title;
  document.getElementById('lnk').value = '';
  document.getElementById('cap-hint').textContent = 'Source set to ' + title;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('q').focus();
}

function renderShelf() {
  var s = load();
  var g = document.getElementById('shelf');
  g.innerHTML = '';
  if (!s.shelf.length) {
    g.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:1rem 0">Nothing on the shelf.</div>';
  }
  s.shelf.forEach(function (b) {
    var d = document.createElement('div');
    d.className = 'book';
    var t = document.createElement('div'); t.className = 'b-title'; t.textContent = b.title;
    var a = document.createElement('div'); a.className = 'b-author'; a.textContent = b.author || '';
    var ta = document.createElement('textarea');
    ta.placeholder = 'Notes, quotes, page numbers'; ta.value = b.note || '';
    ta.oninput = function () {
      var st = load();
      var item = st.shelf.filter(function (x) { return x.id === b.id; })[0];
      if (item) { item.note = ta.value; item.noteDate = new Date().toISOString(); save(st); }
    };
    var acts = document.createElement('div'); acts.className = 'b-acts';
    var logBtn = document.createElement('button');
    logBtn.textContent = 'Log a note';
    logBtn.title = 'Start a dated entry with this book as the source';
    logBtn.onclick = function () { logFromBook(b.title); };
    acts.appendChild(logBtn);
    ['Finished', 'Set aside'].forEach(function (label) {
      var btn = document.createElement('button');
      btn.textContent = label;
      btn.onclick = function () {
        var st = load();
        var item = st.shelf.filter(function (x) { return x.id === b.id; })[0];
        if (!item) return;
        item.status = label === 'Finished' ? 'finished' : 'aside';
        item.archivedDate = new Date().toISOString();
        st.shelfArchive.unshift(item);
        st.shelf = st.shelf.filter(function (x) { return x.id !== b.id; });
        save(st); renderShelf();
      };
      acts.appendChild(btn);
    });
    d.appendChild(t); d.appendChild(a); d.appendChild(ta); d.appendChild(acts);
    g.appendChild(d);
  });

  var past = document.getElementById('shelf-past');
  past.innerHTML = '';
  if (!s.shelfArchive.length) return;
  var lab = document.createElement('div');
  lab.className = 'slabel'; lab.style.marginTop = '2rem';
  lab.textContent = 'Previously';
  past.appendChild(lab);
  s.shelfArchive.forEach(function (b) {
    var row = document.createElement('div');
    row.className = 'past-book';
    var dt = document.createElement('span');
    dt.className = 'pb-date';
    dt.textContent = b.archivedDate ? fmtLong(b.archivedDate) : '';
    var nm = document.createElement('span');
    nm.innerHTML = '<em>' + esc(b.title) + '</em>' + (b.author ? ' <span style="color:var(--ink-faint)">' + esc(b.author) + '</span>' : '') +
      ' <span class="chip" style="font-size:10px">' + (b.status === 'finished' ? 'finished' : 'set aside') + '</span>';
    var back = document.createElement('button');
    back.className = 'e-del'; back.style.marginLeft = 'auto'; back.textContent = 'back to shelf';
    back.onclick = function () {
      var st = load();
      var item = st.shelfArchive.filter(function (x) { return x.id === b.id; })[0];
      if (!item) return;
      delete item.status; delete item.archivedDate;
      st.shelf.push(item);
      st.shelfArchive = st.shelfArchive.filter(function (x) { return x.id !== b.id; });
      save(st); renderShelf();
    };
    var del = document.createElement('button');
    del.className = 'e-del'; del.textContent = 'delete';
    del.onclick = function () {
      if (!confirm('Delete this book and its notes?')) return;
      var st = load();
      st.shelfArchive = st.shelfArchive.filter(function (x) { return x.id !== b.id; });
      save(st); renderShelf();
    };
    row.appendChild(dt); row.appendChild(nm); row.appendChild(back); row.appendChild(del);
    past.appendChild(row);
  });
}

/* ---------- Settings ---------- */
function renderStats() {
  var s = load();
  var srcs = {}, tags = {};
  s.entries.forEach(function (e) {
    if (e.source) srcs[e.source] = 1;
    (e.tags || []).forEach(function (t) { tags[t] = 1; });
  });
  document.getElementById('stats').textContent =
    s.entries.length + ' entries, ' + Object.keys(srcs).length + ' sources, ' +
    Object.keys(tags).length + ' tags, ' + s.shelf.length + ' books on the shelf.';
}

function exportAll() {
  var s = load();
  var blob = new Blob([JSON.stringify(s, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'field-notes-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported');
}

function importFile(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      var s = load();
      var added = 0;
      var have = {};
      s.entries.forEach(function (e) { have[e.id] = 1; });

      if (d.entries) {
        d.entries.forEach(function (e) { if (!have[e.id]) { s.entries.push(e); added++; } });
      }
      if (d.fragments) {
        d.fragments.forEach(function (f) {
          var id = 'i' + f.id;
          if (have[id] || !f.text) return;
          s.entries.push({ id: id, date: f.date, quote: '', note: f.text, link: '', type: 'Thought', source: f.attribution || '', tags: [] });
          added++;
        });
      }
      if (d.notes) {
        Object.keys(d.notes).forEach(function (k) {
          var id = 'in' + k;
          if (have[id] || !d.notes[k]) return;
          s.entries.push({ id: id, date: (d.noteDates && d.noteDates[k]) || new Date().toISOString(), quote: '', note: d.notes[k], link: '', type: 'Reading', source: '', tags: [] });
          added++;
        });
      }
      if (d.shelf) d.shelf.forEach(function (b) {
        if (!s.shelf.some(function (x) { return x.id === b.id; })) s.shelf.push(b);
      });
      if (d.shelfArchive) d.shelfArchive.forEach(function (b) {
        if (!s.shelfArchive.some(function (x) { return x.id === b.id; })) s.shelfArchive.push(b);
      });

      s.entries.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
      save(s); renderAll();
      toast('Imported ' + added + ' entries');
    } catch (e) { toast('Could not read that file'); }
  };
  r.readAsText(file);
}

/* ---------- Panels ---------- */
function showPanel(id) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('on', tabs[i].getAttribute('data-panel') === id);
  }
  var panels = document.querySelectorAll('.panel');
  for (var j = 0; j < panels.length; j++) {
    panels[j].classList.toggle('on', panels[j].id === id);
  }
  if (id === 'p-dig') { buildWeeks(); renderDigest(); }
  if (id === 'p-arch') renderArchive();
  if (id === 'p-set') renderStats();
}

function renderAll() {
  refreshFilters();
  renderWeek();
  renderArchive();
  buildWeeks();
  renderShelf();
  renderStats();
}

/* ---------- Wiring ---------- */
document.getElementById('today').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

var tabEls = document.querySelectorAll('.tab');
for (var i = 0; i < tabEls.length; i++) {
  (function (el) {
    el.onclick = function () { showPanel(el.getAttribute('data-panel')); };
  })(tabEls[i]);
}

document.getElementById('save-btn').onclick = saveEntry;

var segEls = document.querySelectorAll('.seg-b');
for (var k = 0; k < segEls.length; k++) {
  (function (el) {
    el.onclick = function () { setType(el.getAttribute('data-t')); };
  })(segEls[k]);
}

document.getElementById('lnk').oninput = function () {
  var srcEl = document.getElementById('src');
  if (srcEl.value.trim()) return;
  var guess = srcFromUrl(this.value.trim());
  if (guess) {
    srcEl.value = guess;
    document.getElementById('cap-hint').textContent = 'Source set to ' + guess + ' - edit if wrong';
  }
};

document.getElementById('q').onkeydown =
document.getElementById('n').onkeydown = function (ev) {
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); saveEntry(); }
};

document.getElementById('q-search').oninput = renderArchive;
document.getElementById('f-type').onchange = renderArchive;
document.getElementById('f-src').onchange = renderArchive;
document.getElementById('f-tag').onchange = renderArchive;

document.getElementById('f-range').onchange = function () {
  var custom = this.value === 'custom';
  document.getElementById('f-from').style.display = custom ? '' : 'none';
  document.getElementById('f-to').style.display = custom ? '' : 'none';
  renderArchive();
};
document.getElementById('f-from').onchange = renderArchive;
document.getElementById('f-to').onchange = renderArchive;
document.getElementById('f-clear').onclick = function () {
  document.getElementById('q-search').value = '';
  document.getElementById('f-type').value = '';
  document.getElementById('f-src').value = '';
  document.getElementById('f-tag').value = '';
  document.getElementById('f-range').value = '';
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  document.getElementById('f-from').style.display = 'none';
  document.getElementById('f-to').style.display = 'none';
  renderArchive();
};

document.getElementById('wk-pick').onchange = renderDigest;
document.getElementById('dg-group-by').onchange = renderDigest;
document.getElementById('pat-btn').onclick = findPatterns;
document.getElementById('copy-dg').onclick = function () {
  var txt = digestText();
  if (!txt) { toast('Nothing to copy'); return; }
  navigator.clipboard.writeText(txt).then(function () { toast('Digest copied'); });
};

document.getElementById('add-book').onclick = function () {
  var t = prompt('Title:'); if (!t) return;
  var a = prompt('Author:') || '';
  var s = load();
  s.shelf.push({ id: 'b' + Date.now(), title: t, author: a, note: '' });
  save(s); renderShelf();
};

document.getElementById('save-key').onclick = function () {
  var v = document.getElementById('key').value.trim();
  if (!v) return;
  var s = load(); s.apiKey = v; save(s);
  document.getElementById('key').value = '****************';
  toast('Key saved');
};

document.getElementById('exp').onclick = exportAll;
document.getElementById('imp-btn').onclick = function () { document.getElementById('imp').click(); };
document.getElementById('imp').onchange = function () {
  if (this.files && this.files[0]) importFile(this.files[0]);
  this.value = '';
};

migrate();
setType('Reading');
if (load().apiKey) document.getElementById('key').value = '****************';
renderAll();
</script>
